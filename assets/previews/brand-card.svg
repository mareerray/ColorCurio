<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1080 720"
>
    <title>A brand card with a logo mark and text blocks</title>

    <!-- Color 1: Base / background -->
    <rect
        id="preview-base"
        width="1080"
        height="720"
        fill="#FFF7ED"
    />

    <!-- Color 3: Support / card surface -->
    <rect
        id="preview-support"
        x="120"
        y="140"
        width="840"
        height="440"
        rx="36"
        fill="#A8C5AE"
    />

    <!-- Color 2: Accent / logo mark -->
    <circle
        id="preview-accent"
        cx="300"
        cy="320"
        r="80"
        fill="#F3D68A"
    />

    <!-- Color 4: Deep support / brand name and tagline -->
    <g id="preview-deep" fill="#789C83">
        <rect
            x="430" y="270"
            width="360" height="44"
            rx="12"
        />
        <rect
            x="430" y="350"
            width="280" height="20"
            rx="10"
        />
        <rect
            x="430" y="390"
            width="220" height="20"
            rx="10"
        />
    </g>

    <!-- Color 5: Extra / decorative detail -->
    <rect
        id="preview-extra"
        x="430"
        y="460"
        width="180"
        height="16"
        rx="8"
        fill="#5C7A66"
    />
</svg>